name: Claude PR Review

on:
  issue_comment:
    types: [created]

jobs:
  mention-trigger:
    # Runs when someone (you, or a bot like Codex) comments "@claude" on a PR/issue
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
