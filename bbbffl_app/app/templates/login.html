<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBBFFL Coach Sign In</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; background: #0f1115; color: #e7e9ee; display: flex; justify-content: center; }
  .card { width: 100%; max-width: 360px; background: #171a21; border: 1px solid #2a2f3a; border-radius: 10px; padding: 24px; margin-top: 40px; }
  h1 { font-size: 1.2rem; margin: 0 0 18px; }
  label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #9aa3b2; }
  input[type=email], input[type=password] { width: 100%; box-sizing: border-box; font-size: 0.95rem; padding: 8px 10px; border-radius: 6px; border: 1px solid #333a48; background: #0f1115; color: inherit; margin-bottom: 14px; }
  button { width: 100%; font-size: 0.95rem; padding: 9px 8px; border-radius: 6px; border: 1px solid #3a6ea5; background: #3a6ea5; color: white; cursor: pointer; }
  button:hover { background: #345f8f; }
  .error { background: #3a1f1f; border: 1px solid #a53a3a; color: #f2b8b8; border-radius: 6px; padding: 8px 10px; font-size: 0.85rem; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>BBBFFL Coach Sign In</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
