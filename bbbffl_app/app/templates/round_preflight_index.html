<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prepare a round · BBBFFL</title><style>:root{color-scheme:dark}body{font:15px system-ui;margin:auto;max-width:900px;padding:22px;background:#0f1115;color:#e7e9ee}a{color:#79c0ff}.card{display:block;background:#171a21;border:1px solid #303744;border-radius:10px;padding:16px;margin:12px 0;text-decoration:none}.card:hover{border-color:#79c0ff}.muted{color:#aab2c0}.error{color:#f85149}</style></head>
<body><a href="/admin/season-centre">← Season operations</a><h1>Prepare a BBBFFL round</h1><p class="muted">Choose the recognisable BBBFFL round in your active role and season context. AFL identity is confirmed separately in preflight.</p><main id="rounds">Loading rounds…</main>
<script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const h={};const t=localStorage.getItem('bbbffl_admin_token');if(t)h['X-Admin-Token']=t;fetch('/api/admin/round-preflight',{headers:h}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.detail);return d}).then(d=>{document.querySelector('#rounds').innerHTML=d.rounds.map(r=>`<a class="card" href="${esc(r.preflight_url)}"><strong>${esc(r.season_label)} · ${esc(r.competition_label)}</strong><br>BBBFFL Round ${esc(r.sequence)} — ${esc(r.round_label)}</a>`).join('')||'<p>No ordinary rounds are available in this active context.</p>'}).catch(e=>document.querySelector('#rounds').innerHTML=`<p class="error">${esc(e.message)}</p>`);</script></body></html>
