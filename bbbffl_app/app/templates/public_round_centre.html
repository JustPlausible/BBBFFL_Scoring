<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBBFFL Round Centre</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#18202a;font:15px system-ui,sans-serif}header,main{max-width:900px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}nav a{margin-left:12px;color:#0757a5}.card{background:white;border:1px solid #ccd3da;border-radius:10px;padding:14px;margin:12px 0}.match{border-left:6px solid #2878bd}.official,.corrected_official{border-left-color:#238636}.under_review{border-left-color:#9a6700}.upcoming{border-left-color:#6e7781}.scoreline{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.scoreline>:last-child{text-align:right}.score{font-size:1.8rem;font-weight:750}.status{font-weight:700}.lineups{display:grid;grid-template-columns:1fr 1fr;gap:12px}.players{list-style:none;padding:0;margin:8px 0}.players li{padding:6px 0;border-top:1px solid #e7eaee}.tag{font-size:.8rem;font-weight:700}.note{font-size:.85rem;color:#575f68}.ladder{width:100%;border-collapse:collapse}.ladder th,.ladder td{padding:7px 4px;text-align:right;border-bottom:1px solid #ddd}.ladder th:nth-child(2),.ladder td:nth-child(2){text-align:left}@media(max-width:600px){header{align-items:flex-start}.lineups{grid-template-columns:1fr}.card{padding:11px}.wide{display:none}.scoreline{grid-template-columns:1fr auto 1fr}}
</style></head><body><header><div><strong>BBBFFL</strong><div id="heading">Round Centre</div></div><nav><a href="#matches">Round Centre</a><a href="#ladder">Ladder</a></nav></header><main><div id="error" role="alert"></div><section id="matches"></section><section id="ladder" class="card"><h2>Ladder</h2><div id="ladder-body">Loading…</div></section></main>
<script>
const season={{ season_id|tojson }}, roundId={{ round_id|tojson }}, interval={{ poll_interval_seconds|tojson }}*1000;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function player(p){let outcome=p.outcome==='replaced_by_interchange'?'DNP · replaced by Interchange':p.outcome==='confirmed_dnp_zero'?'Confirmed DNP · scored zero':'';let deferred=p.deferred_source?`<div class="note">↪ ${esc(p.deferred_source.label)}</div>`:'';return `<li><strong>${esc(p.position)}</strong> ${esc(p.player_name||'Vacant')} <span class="tag">${esc(p.effective_score)}</span>${outcome?`<div class="note">${esc(outcome)}</div>`:''}${deferred}</li>`}
function side(s){if(!s.lineup)return '<div><p>Submitted lineup not yet public.</p></div>';let interchange=s.lineup.interchange;return `<div><ul class="players">${s.lineup.players.map(player).join('')}</ul><div class="note"><strong>Interchange:</strong> ${esc(interchange.player_name||'None')}${interchange.replaces_position?` · replaces ${esc(interchange.replaces_position)}`:''}</div></div>`}
function match(m){return `<article class="card match ${esc(m.status)}"><div class="status">${esc(m.status_label)}</div><div class="scoreline"><div><strong>${esc(m.home.team.name)}</strong><div class="score">${esc(m.home.official_score??m.home.calculated_score??'–')}</div></div><span>v</span><div><strong>${esc(m.away.team.name)}</strong><div class="score">${esc(m.away.official_score??m.away.calculated_score??'–')}</div></div></div><div class="lineups">${side(m.home)}${side(m.away)}</div></article>`}
async function load(){try{let base=`/api/public/seasons/${encodeURIComponent(season)}/rounds/${encodeURIComponent(roundId)}`;let [r,l]=await Promise.all([fetch(base),fetch(base+'/ladder')]);if(!r.ok||!l.ok)throw Error('Round data is temporarily unavailable');let d=await r.json(), ladder=await l.json();document.querySelector('#heading').textContent=`Round ${d.round_number} Centre`;document.querySelector('#matches').innerHTML=d.matchups.map(match).join('');document.querySelector('#ladder-body').innerHTML=`<table class="ladder"><thead><tr><th>#</th><th>Team</th><th>Pts</th><th>W</th><th>D</th><th>L</th><th class="wide">PF</th><th class="wide">PA</th><th>%</th></tr></thead><tbody>${ladder.rows.map(x=>`<tr><td>${x.rank}</td><td>${esc(x.team_name)}${x.tied?' =':''}</td><td>${x.competition_points}</td><td>${x.wins}</td><td>${x.draws}</td><td>${x.losses}</td><td class="wide">${x.points_for}</td><td class="wide">${x.points_against}</td><td>${Number(x.percentage).toFixed(1)}</td></tr>`).join('')}</tbody></table>`;document.querySelector('#error').textContent=''}catch(e){document.querySelector('#error').textContent=e.message}}
load();setInterval(load,Math.max(interval,5000));
</script></body></html>
