<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBBFFL Regular-season Round Centre</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font:15px system-ui,sans-serif}header,main{max-width:1180px;margin:auto;padding:16px}.bar,.actions,.score{display:flex;gap:10px;align-items:center;flex-wrap:wrap}a{color:#79c0ff}input,select,button{font:inherit;padding:8px;border:1px solid #484f58;border-radius:6px;background:#161b22;color:inherit}button{cursor:pointer}.primary{background:#1f6feb}.danger{background:#8b1a1a}.card,.notice{border:1px solid #30363d;border-radius:10px;background:#161b22;padding:14px;margin:14px 0}.matchup{border-left:5px solid #388bfd}.blocked{border-left-color:#f85149}.official{border-left-color:#3fb950}.score{justify-content:space-between}.score strong{font-size:1.5rem}.side{margin-top:14px}.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:8px}.slot{background:#0d1117;border-radius:7px;padding:9px}.muted{color:#8b949e}.warn{color:#ff7b72}.ok{color:#56d364}.pill{padding:2px 7px;border-radius:999px;background:#30363d;font-size:.8rem}.control{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.control input{min-width:0;flex:1}.history{font-size:.9rem}#message:empty{display:none}@media(max-width:600px){header,main{padding:10px}.score{align-items:flex-start}.actions>*{width:100%}}
</style></head><body>
<header><h1>Regular-season Round Centre</h1><div class="bar"><a href="/admin">Legacy Grand Final admin</a><label>Round <select id="round-select"><option>Loading…</option></select></label><input type="password" id="token" placeholder="Operator token"><button id="save">Save & reload</button></div></header>
<main><div id="message" class="notice"></div><section id="round"></section></main>
<script>
const initialRound={{ round_id|tojson }};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=()=>localStorage.getItem('bbbffl_admin_token')||'';
document.querySelector('#token').value=token();
document.querySelector('#save').onclick=()=>{localStorage.setItem('bbbffl_admin_token',document.querySelector('#token').value);load();};
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Admin-Token':token()},body:body?JSON.stringify(body):undefined});let data=await r.json().catch(()=>({detail:r.statusText}));if(!r.ok){const error=new Error(data.detail||r.statusText);error.status=r.status;throw error}return data}
function mutation(path,body){return api(path,body).then(()=>loadRound(current)).catch(e=>{document.querySelector('#message').innerHTML=`<strong>${e.status===409?'Conflict — this page was stale.':'Action failed.'}</strong> ${esc(e.message)} Current authoritative state has been reloaded.`;return loadRound(current)})}
let current=initialRound;
async function load(){try{const rounds=await api('/api/admin/round-review');const select=document.querySelector('#round-select');select.innerHTML=rounds.map(r=>`<option value="${esc(r.bbbffl_round_id)}">${esc(r.afl_season_id)} · BBBFFL R${r.fixture_round_number} · ${esc(r.state)}</option>`).join('');current=current||rounds[0]?.bbbffl_round_id;if(current){select.value=current;await loadRound(current)}else document.querySelector('#round').innerHTML='<div class="notice">No persisted regular-season rounds are available.</div>';select.onchange=()=>{current=select.value;history.replaceState({},'',`/scorer/round-centre/${current}`);loadRound(current)}}catch(e){document.querySelector('#message').textContent='Unable to load scorer rounds: '+e.message}}
function slotHtml(s,m,side){const rec=s.dnp_recommendation?`<div class="${s.dnp_ruling==null?'warn':'muted'}">Evidence: ${esc(s.participation_state)} · ${esc(s.dnp_recommendation)} · ${esc(s.participation_reason||'')}</div>`:'';return `<div class="slot"><strong>${esc(s.slot)}</strong> <span class="pill">${s.effective_score}</span><div>${s.season_player_id?`Player ${esc(s.canonical_player_id)}`:'Vacant'}</div><div class="muted">Calculated ${esc(s.calculated_score)} · played ${s.played?'yes':'no'}</div>${rec}<div class="muted">Score source: ${esc(s.scoring_source||'unknown')} · AFL round ${esc(s.source_afl_round_id??'–')} · match ${esc(s.source_afl_match_id??'–')}</div><div>Ruling: ${s.dnp_ruling==null?'unresolved':s.dnp_ruling?'DNP confirmed':'DNP rejected'}</div>${s.override_score!=null?`<div class="warn">Override ${s.override_score}: ${esc(s.override_reason)}</div>`:''}<div class="control"><button data-dnp="1" data-mid="${m.matchup_id}" data-entry="${side.season_entry_id}" data-slot="${s.slot}" data-ver="${m.review_version}">Confirm DNP</button><button data-dnp="0" data-mid="${m.matchup_id}" data-entry="${side.season_entry_id}" data-slot="${s.slot}" data-ver="${m.review_version}">Reject DNP</button></div><div class="control"><input type="number" step="0.5" placeholder="Override score"><input placeholder="Required reason"><button data-override data-mid="${m.matchup_id}" data-entry="${side.season_entry_id}" data-slot="${s.slot}" data-ver="${m.review_version}">Set</button></div></div>`}
function sideHtml(side,m){const ir=side.interchange;const opts=Object.entries(ir.potential_scores||{}).map(([p,s])=>`<option value="${esc(p)}">${esc(p)} (${esc(s)})</option>`).join('');const irEvidence=ir.season_player_id?`<div class="${ir.dnp_ruling==null&&ir.dnp_recommendation?'warn':'muted'}">Evidence: ${esc(ir.participation_state||'unknown')} · ${esc(ir.dnp_recommendation||'none')} · ${esc(ir.participation_reason||'')}</div><div class="muted">Score source: ${esc(ir.scoring_source||'unknown')} · AFL round ${esc(ir.source_afl_round_id??'–')} · match ${esc(ir.source_afl_match_id??'–')}</div><div>Ruling: ${ir.dnp_ruling==null?'unresolved':ir.dnp_ruling?'DNP confirmed':'DNP rejected'}</div><div class="control"><button data-dnp="1" data-mid="${m.matchup_id}" data-entry="${side.season_entry_id}" data-slot="Interchange" data-ver="${m.review_version}">Confirm Interchange DNP</button><button data-dnp="0" data-mid="${m.matchup_id}" data-entry="${side.season_entry_id}" data-slot="Interchange" data-ver="${m.review_version}">Reject Interchange DNP</button></div>`:'';return `<section class="side"><div class="score"><h3>${esc(side.team_name||side.season_entry_id)} <span class="muted">${esc(side.coach_name||'')}</span></h3><strong>${side.effective_score}</strong></div><div class="muted">Calculated/live ${side.calculated_score} · lineup ${esc(side.lineup_id||'unavailable')} v${esc(side.lineup_version||'–')}</div><div class="slots">${side.slots.map(s=>slotHtml(s,m,side)).join('')}</div><div class="card"><strong>Interchange</strong> player ${esc(ir.canonical_player_id||'none')} · assignment ${esc(ir.target_position||'unresolved')}${irEvidence}<div class="control"><select><option value="">No assignment</option>${opts}</select><button data-interchange data-mid="${m.matchup_id}" data-entry="${side.season_entry_id}" data-ver="${m.review_version}">Confirm assignment</button></div></div></section>`}
function matchupHtml(m){const official=m.official_result;return `<article class="card matchup ${m.blockers.length?'blocked':official?'official':''}"><div class="score"><h2>Matchup ${m.matchup_order}</h2><span class="pill">review v${m.review_version}</span></div><div class="score"><strong>${esc(m.home.team_name)} ${m.home.effective_score}</strong><strong>${m.away.effective_score} ${esc(m.away.team_name)}</strong></div><div class="muted">Calculation revision ${esc(m.calculation_revision||'–')} · rules ${esc(m.rules_version_id||'–')} · evidence ${m.evidence_fresh?'fresh':'stale'}</div>${m.blockers.map(b=>`<div class="warn">⚠ ${esc(b)}</div>`).join('')}${official?`<div class="notice"><strong>Official authoritative result v${official.version}</strong>: ${official.home_score}–${official.away_score}<div class="muted">Published ${esc(official.published_at)} by ${esc(official.published_by||'operator')} · ${esc(official.reason||'')}</div></div>`:''}${sideHtml(m.home,m)}${sideHtml(m.away,m)}<details class="history"><summary>Official version history (${m.official_history.length})</summary>${m.official_history.map(h=>`<p>v${h.version} · ${h.home_score}–${h.away_score} · ${esc(h.published_at)} · ${esc(h.reason||'')}</p>`).join('')||'<p>No official versions.</p>'}</details>${official?`<div class="control"><input placeholder="Required correction reason"><button class="danger" data-correct data-mid="${m.matchup_id}">Publish corrected version</button></div>`:''}</article>`}
function ladderHtml(l){if(!l)return'';return `<section class="card"><h2>Authoritative ladder through round ${l.through_round}</h2>${l.rows.map(r=>`<div class="score"><span><strong>#${r.rank}</strong> ${esc(r.season_entry_id)}</span><span>${r.competition_points} pts · ${Number(r.percentage).toFixed(2)}%</span></div>`).join('')}</section>`}
const NEXT_LIFECYCLE_STATE={upcoming:'open',open:'live',live:'review'};
async function loadRound(id){const d=await api(`/api/admin/round-review/${id}`);const next=NEXT_LIFECYCLE_STATE[d.state];document.querySelector('#round').innerHTML=`<section class="card"><h2>${d.identity.afl_season_id} BBBFFL Round ${d.identity.fixture_round_number}</h2><div class="bar"><span class="pill">${esc(d.state)}</span><span>AFL source ${d.identity.afl_season_id} / round ${d.identity.afl_round_id}</span><span>mapping revision ${d.identity.mapping_revision}</span></div>${d.replay.enabled?`<p class="muted">Replay diagnostic: ${esc(d.replay.classification)}. The mapping above is the normal round mapping; each player card shows its actual evidence source. Sporting rules are unchanged.</p>`:''}<div class="control"><button id="calculate">Calculate / refresh scores</button>${next?`<input id="transition-reason" placeholder="Reason (optional)"><button id="transition">Advance round to '${esc(next)}'</button>`:''}</div><h3 class="${d.ready_for_signoff?'ok':'warn'}">${d.ready_for_signoff?'Ready for atomic sign-off':'Not ready for sign-off'}</h3>${d.blockers.map(b=>`<div class="warn">${esc(b)}</div>`).join('')}${d.ready_for_signoff?'<div class="control"><input id="sign-reason" placeholder="Sign-off reason"><button class="primary" id="sign">Publish all five results</button></div>':''}</section>${d.matchups.map(matchupHtml).join('')}${ladderHtml(d.ladder)}`;wire(d)}
function wire(d){document.querySelectorAll('[data-dnp]').forEach(b=>b.onclick=()=>mutation(`/api/admin/round-review/${current}/dnp`,{matchup_id:b.dataset.mid,season_entry_id:b.dataset.entry,slot:b.dataset.slot,dnp:b.dataset.dnp==='1',expected_review_version:+b.dataset.ver,reason:'Scorer Round Centre ruling'}));document.querySelectorAll('[data-interchange]').forEach(b=>b.onclick=()=>mutation(`/api/admin/round-review/${current}/interchange`,{matchup_id:b.dataset.mid,season_entry_id:b.dataset.entry,target_position:b.previousElementSibling.value||null,expected_review_version:+b.dataset.ver,reason:'Scorer Round Centre ruling'}));document.querySelectorAll('[data-override]').forEach(b=>b.onclick=()=>{const inputs=b.parentElement.querySelectorAll('input');if(!inputs[1].value)return alert('A manual override reason is required.');mutation(`/api/admin/round-review/${current}/override`,{matchup_id:b.dataset.mid,season_entry_id:b.dataset.entry,position:b.dataset.slot,override_score:inputs[0].value===''?null:+inputs[0].value,reason:inputs[1].value,expected_review_version:+b.dataset.ver})});document.querySelectorAll('[data-correct]').forEach(b=>b.onclick=()=>{const reason=b.previousElementSibling.value;if(!reason)return alert('A correction reason is required.');mutation(`/api/admin/round-review/matchup/${b.dataset.mid}/correct`,{reason})});const calculate=document.querySelector('#calculate');if(calculate)calculate.onclick=()=>mutation(`/api/admin/round-review/${current}/calculate`);const advance=document.querySelector('#transition');if(advance)advance.onclick=()=>mutation(`/api/admin/round-review/${current}/transition`,{target:NEXT_LIFECYCLE_STATE[d.state],reason:document.querySelector('#transition-reason').value||null});const sign=document.querySelector('#sign');if(sign)sign.onclick=()=>mutation(`/api/admin/round-review/${current}/signoff`,{reason:document.querySelector('#sign-reason').value||null})}
load();
</script></body></html>
