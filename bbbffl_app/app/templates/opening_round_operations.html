<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening Round replay nominations · BBBFFL</title><style>
:root{color-scheme:dark}body{font:15px system-ui;margin:auto;max-width:950px;padding:22px;background:#0f1115;color:#e7e9ee}a{color:#79c0ff}.card{background:#171a21;border:1px solid #303744;border-radius:11px;padding:17px;margin:14px 0}.banner{border:3px solid #d29922}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}label{display:grid;gap:4px}button,input,select{font:inherit;padding:8px;border:1px solid #596273;border-radius:6px;background:#222733;color:inherit}.muted{color:#aab2c0}.item{padding:10px;background:#11151b;border-radius:7px;margin:8px 0}
</style></head><body><a href="/admin/round-preflight">← Round preflight</a><h1>Opening Round deferred-selection replay</h1><div id="message"></div><main id="app">Loading accepted rules…</main><script>
const seasonId={{season_id|tojson}},csrf={{csrf_token|tojson}};let state;const e=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,method='GET',body){let r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}function msg(x,ok=false){let n=document.querySelector('#message');n.className='card';n.style.borderColor=ok?'#3fb950':'#f85149';n.textContent=x}
function render(d){state=d;document.querySelector('#app').innerHTML=`<section class="card banner"><strong>REPLAY / RECONSTRUCTED INPUT</strong><p><b>Representing:</b> ${e(d.represented_entry.team_name)}</p><p>${e(d.provenance_notice)}</p></section><section class="card"><h2>Accepted, authoritative rules</h2>${d.rules.map(r=>`<div class="item">Club ${e(r.afl_club_id)} · Opening Round ${e(r.afl_opening_round_id)} → compensating bye AFL round ${e(r.afl_bye_round_id)} → target BBBFFL round <b>${e(r.bbbffl_round_id)}</b><br><span class="muted">Accepted revision ${e(r.revision)} · ${e(r.evidence_classification)}</span></div>`).join('')||'<b>No accepted Opening Round rules exist for this season.</b>'}<form id="nominate"><div class="grid"><label>Accepted rule<select name="rule" required>${d.rules.map(r=>`<option value="${e(r.rule_id)}">Club ${e(r.afl_club_id)} → ${e(r.bbbffl_round_id)}</option>`).join('')}</select></label><label>Owned player<select name="player" required>${d.players.map(p=>`<option value="${e(p)}">${e(p)}</option>`).join('')}</select></label><label>Target position<select name="position">${['F1','F2','F3','M1','M2','M3','Ruck','Tackler','Interchange'].map(p=>`<option>${p}</option>`).join('')}</select></label><label>Replay reason<input name="reason" required value="Replay/reconstructed Opening Round nomination"></label></div><button>Create and preload locked nomination</button></form></section><section class="card"><h2>Current locked deferred selections</h2>${d.nominations.map(n=>`<div class="item"><b>${e(n.position)}</b> · player ${e(n.season_player_id)} · target ${e(n.bbbffl_round_id)}<br><span class="muted">Locked; source Opening Round match ${e(n.source_afl_match_id)}. Entered by ${e(n.actor_id)} (${e(n.actor_role)}), not attributed to the represented coach.</span><details><summary>Correct nomination</summary><form data-correct="${e(n.nomination_id)}"><input name="position" value="${e(n.position)}"><input name="player" value="${e(n.season_player_id)}"><input name="reason" required placeholder="Correction reason"><button>Apply audited correction</button></form></details></div>`).join('')||'<p>No replay nominations for this represented entry.</p>'}</section>`;document.querySelector('#nominate').onsubmit=nominate;document.querySelectorAll('[data-correct]').forEach(x=>x.onsubmit=correct)}async function nominate(x){x.preventDefault();let f=new FormData(x.target);try{await api(`/api/operations/seasons/${seasonId}/opening-round/nominations`,'POST',{rule_id:f.get('rule'),season_player_id:f.get('player'),position:f.get('position'),reason:f.get('reason')});await load();msg('Replay nomination created and target lineup preloaded.',true)}catch(e){msg(e.message)}}async function correct(x){x.preventDefault();let f=new FormData(x.target);try{await api(`/api/operations/seasons/${seasonId}/opening-round/nominations/${x.target.dataset.correct}`,'PATCH',{position:f.get('position'),season_player_id:f.get('player'),reason:f.get('reason')});await load();msg('Audited correction applied.',true)}catch(e){msg(e.message)}}async function load(){render(await api(`/api/operations/seasons/${seasonId}/opening-round`))}load().catch(e=>msg(e.message));
</script></body></html>
