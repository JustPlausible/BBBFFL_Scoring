services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: bbbffl_round1_rehearsal
      POSTGRES_USER: bbbffl
      POSTGRES_PASSWORD: rehearsal-only
    volumes:
      - rehearsal-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbbffl -d bbbffl_round1_rehearsal"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ./bbbffl_app
    env_file:
      - ./bbbffl_app/.env.rehearsal
    ports:
      - "8000:8000"
    volumes:
      - rehearsal-evidence:/replay/evidence
    depends_on:
      database:
        condition: service_healthy

volumes:
  rehearsal-database:
  rehearsal-evidence:
