<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBBFFL Season</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#18202a;font:15px system-ui,sans-serif}header,main{max-width:960px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}nav a{margin-left:12px;color:#0757a5}
.round-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.round-bar select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid #ccd3da;max-width:100%}
.round-bar button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid #ccd3da;background:white;cursor:pointer}
.round-bar button:disabled{opacity:.4;cursor:default}
.badge{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:#e7eaee;color:#3a4450}
.badge.published{background:#dcf3e2;color:#1a6b34}
.badge.scheduled{background:#eef1f4;color:#5b6570}
.card{background:white;border:1px solid #ccd3da;border-radius:10px;padding:14px;margin:12px 0}
.matches{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match{border-left:6px solid #6e7781;text-decoration:none;color:inherit;display:block}
.match.official,.match.corrected_official{border-left-color:#238636}
.match.under_review{border-left-color:#9a6700}
.match.upcoming{border-left-color:#6e7781}
.match.scheduled{border-left-color:#9aa4ae}
.status{font-weight:700;font-size:.85rem}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:6px}
.scoreline>:last-child{text-align:right}
.score{font-size:1.5rem;font-weight:750}
.note{font-size:.8rem;color:#575f68;margin-top:6px}
.ladder{width:100%;border-collapse:collapse}
.ladder th,.ladder td{padding:7px 4px;text-align:right;border-bottom:1px solid #ddd}
.ladder th:nth-child(2),.ladder td:nth-child(2){text-align:left}
.match.bye{border-left-color:#9aa4ae}
.lineups-toggle{margin-top:8px}
.lineups-toggle summary{cursor:pointer;font-size:.8rem;font-weight:700;color:#0757a5}
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.players{list-style:none;padding:0;margin:8px 0}
.players li{padding:6px 0;border-top:1px solid #e7eaee}
.tag{font-size:.8rem;font-weight:700}
.superscore-entry{border-top:1px solid #e1e5e9}.superscore-entry:first-child{border-top:0}
.superscore-team{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 4px;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.superscore-rank{font-weight:700}.superscore-total{font-weight:750}.superscore-dots{grid-column:2/4;display:flex;gap:6px}
.superscore-dot{width:11px;height:11px;border-radius:50%;background:#aab2bb}.superscore-dot.live{background:#d1242f}.superscore-dot.postgame{background:#bf6a02}.superscore-dot.completed{background:#238636}.superscore-dot.dnp{background:#8250df}.superscore-dot.vacant,.superscore-dot.unnamed{background:#57606a}
.superscore-detail{padding:0 4px 12px 36px}.superscore-player{display:grid;grid-template-columns:minmax(80px,.8fr) minmax(120px,1.3fr) minmax(100px,1fr) auto auto;gap:8px;padding:6px 0;border-top:1px solid #e7eaee;align-items:center}.superscore-player .state{text-transform:capitalize;font-size:.8rem;color:#575f68}
@media(max-width:640px){.matches{grid-template-columns:1fr}.card{padding:11px}.wide{display:none}.lineups{grid-template-columns:1fr}}
</style></head><body>
<header><div><strong>BBBFFL</strong><div id="heading">Season</div></div><nav><a href="/">Home</a></nav></header>
<main>
<div id="error" role="alert"></div>
<div class="round-bar">
  <button id="prevBtn" type="button">← Previous round</button>
  <select id="roundSelect" aria-label="Select round"></select>
  <button id="nextBtn" type="button">Next round →</button>
  <span id="roundBadge"></span>
</div>
<section id="matches" class="matches"></section>
<section id="superscore"></section>
<section id="ladder" class="card"><h2>Ladder <span class="note" id="ladderThrough"></span></h2><div id="ladder-body">Loading…</div></section>
</main>
<script>
const season={{ season_id|tojson }};
let roundNumber={{ round_number|tojson }};
let expandedSuperScoreEntry=null;
const pollIntervalMs={{ poll_interval_seconds|tojson }}*1000;
// Known server-side without any client fetch (a round_number's stream
// never changes), so polling can be scheduled independently of whether
// the first render actually succeeds -- see the bottom of this script.
const isFinalsRound={{ stream|tojson }}==='finals';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Australian local time only -- public BBBFFL pages never show raw UTC
// outside diagnostics (issue #161); the JSON API still carries UTC ISO
// instants for anything that needs them.
const auTime=iso=>{if(!iso)return null;try{return new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Melbourne',dateStyle:'medium',timeStyle:'short'}).format(new Date(iso))}catch(_){return null}};
function seasonUrl(n){return `/seasons/${encodeURIComponent(season)}/rounds/${n}`}
function apiUrl(n){return `/api/public/seasons/${encodeURIComponent(season)}/rounds/${n}`}

function matchCard(m, detailRoundId){
  let scoreline='';
  if(m.status!=='scheduled'){
    scoreline=`<div class="scoreline"><div><strong>${esc(m.home.team.name)}</strong><div class="score">${scoreCell(m.home)}</div></div><span>v</span><div><strong>${esc(m.away.team.name)}</strong><div class="score">${scoreCell(m.away)}</div></div></div>`;
  } else {
    scoreline=`<div class="scoreline"><div><strong>${esc(m.home.team.name)}</strong></div><span>v</span><div><strong>${esc(m.away.team.name)}</strong></div></div>`;
  }
  let published=auTime(m.published_at);
  let note=published?`<div class="note">Published ${esc(published)} (AEST/AEDT)</div>`:(m.status==='scheduled'?`<div class="note">Preview only -- lineups and scores are not yet available.</div>`:'');
  let inner=`<div class="status">${esc(m.status_label)}</div>${scoreline}${note}`;
  if(detailRoundId){
    return `<a class="card match ${esc(m.status)}" href="/seasons/${encodeURIComponent(season)}/rounds/${encodeURIComponent(detailRoundId)}#match-${esc(m.order)}">${inner}</a>`;
  }
  return `<div class="card match ${esc(m.status)}">${inner}</div>`;
}

// Finals-only: the persisted bracket seed (issue #213 Codex follow-up) --
// "1. Running Hots" -- never inferred/recomputed here, just displayed
// exactly as `app.public_finals._seed_positions` (the frozen
// `finals_bracket_seed` rows) reports it. `seed` is null/undefined for a
// team the public read model could not resolve a seed for.
function teamLabel(team){
  return (team.seed!==null && team.seed!==undefined) ? `${team.seed}. ${esc(team.name)}` : esc(team.name);
}

// Player/lineup rendering (issue #213 Codex follow-up; interchange-
// replacement wording sharpened, and per-position football-score line
// added, by issue #261) -- finals matchup sides carry the exact same
// public lineup-evidence shape (`app.public_rounds._side`/`_slot`)
// ordinary matchups already expose, so the same renderer applies
// unchanged rather than a second one.
//
// A `replaced_by_interchange` row must never look like the position is
// simply vacant: `p.player_name` (the coach's *original* selection, DNP'd
// or never named -- see `_slot`'s own comment) and `p.interchange_player_name`
// (who is effectively scoring it now) are shown together, alongside the
// effective score against that position -- the same original/replacement
// distinction the established Grand Final renderer's `playerCell()` makes
// (`public.html`), reused here as wording rather than copied as code,
// since the two pages' DTOs differ.
//
// `p.football_line` is the same "G.B" notation `scoreCell` shows for a
// team total, applied per position (issue #261 scope extension): a
// Forward's literal AFL goals/behinds when known and consistent, divmod
// otherwise -- `app.public_rounds._slot`'s own `football_line` field,
// never recomputed here.
function positionScoreTag(p){
  if(p.football_line==null)return `<span class="tag">${esc(p.effective_score)}</span>`;
  return `<span class="tag">${esc(p.football_line)} (${esc(p.effective_score)})</span>`;
}
function player(p){
  let deferred=p.deferred_source?`<div class="note">↪ ${esc(p.deferred_source.label)}</div>`:'';
  if(p.outcome==='replaced_by_interchange'){
    let original=p.player_name?`${esc(p.player_name)} (DNP)`:'Vacant';
    let replacement=p.interchange_player_name?esc(p.interchange_player_name):'Interchange';
    return `<li><strong>${esc(p.position)}</strong> ${original} → replaced by ${replacement} ${positionScoreTag(p)}<div class="note">Effective ${esc(p.position)} score via Interchange replacement</div>${deferred}</li>`;
  }
  let outcome=p.outcome==='confirmed_dnp_zero'?'Confirmed DNP · scored zero':'';
  return `<li><strong>${esc(p.position)}</strong> ${esc(p.player_name||'Vacant')} ${positionScoreTag(p)}${outcome?`<div class="note">${esc(outcome)}</div>`:''}${deferred}</li>`;
}
function side(s){if(!s.lineup)return '<div><p class="note">Submitted lineup not yet public.</p></div>';let interchange=s.lineup.interchange;return `<div><ul class="players">${s.lineup.players.map(player).join('')}</ul><div class="note"><strong>Interchange:</strong> ${esc(interchange.player_name||'None')}${interchange.replaces_position?` · replaces ${esc(interchange.replaces_position)}`:''}</div></div>`}

// Finals matchup cards (issue #213) -- the finals-bracket analogue of
// `matchCard` above: labelled by bracket slot (Elimination Final,
// Qualifying Final, ...) rather than a bare match order. A finals week
// has no separate per-matchup lineup-breakdown page of its own (a direct
// finals-round URL canonicalises back to this same aggregate page), so
// positional evidence is an inline expandable section on the card
// itself instead -- the same `side`/`player` renderer and public
// lineup-evidence shape the ordinary per-matchup detail page uses,
// never scorer-only/unpublished state (`side()` already only ever shows
// a lineup once a real authoritative submission exists).
// Issue #261 (scope extension: ordinary Rounds 1-20 through Finals): a
// matchup total is shown in the established BBBFFL football-score
// notation ("G.B (Total)", e.g. "24.14 (158)") using `app.public_rounds.
// _side`'s `football_line` field, reusing the exact conversion
// `app.presentation` already uses for the Grand Final/SuperScore vertical
// -- never a bare point total on its own, and never a second, independent
// conversion. Used by both the ordinary `matchCard` and `finalsMatchCard`
// below. Falls back to the bare total if a football line genuinely isn't
// available (no calculation and no official result yet).
function scoreCell(matchSide){
  let total=matchSide.official_score??matchSide.calculated_score;
  if(total===null||total===undefined)return '–';
  return matchSide.football_line?`${esc(matchSide.football_line)} <span class="tag">(${esc(total)})</span>`:esc(total);
}
function finalsMatchCard(m){
  let scoreline='';
  if(m.status!=='scheduled'){
    scoreline=`<div class="scoreline"><div><strong>${teamLabel(m.home.team)}</strong><div class="score">${scoreCell(m.home)}</div></div><span>v</span><div><strong>${teamLabel(m.away.team)}</strong><div class="score">${scoreCell(m.away)}</div></div></div>`;
  } else {
    scoreline=`<div class="scoreline"><div><strong>${teamLabel(m.home.team)}</strong></div><span>v</span><div><strong>${teamLabel(m.away.team)}</strong></div></div>`;
  }
  // The `.status` heading above carries the bracket slot label (e.g.
  // "Qualifying Final"), not `m.status_label` -- unlike the ordinary
  // `matchCard`, which has no slot to show there and uses that heading
  // for status instead. Once a result is officially published the
  // "Published ..." note already makes that unambiguous; until then
  // (`calculated_live`/`under_review`/`upcoming`) `m.status_label` (e.g.
  // "Live calculated — not official") must still be shown somewhere, or
  // an unofficial score would appear indistinguishable from a published
  // one (issue #213 Codex follow-up).
  let published=auTime(m.published_at);
  let note=published?`<div class="note">Published ${esc(published)} (AEST/AEDT)</div>`:`<div class="note">${esc(m.status_label)}</div>`;
  // `lineup` is only ever present on an *opened* matchup's side dict
  // (`app.public_finals._finals_matchups` -> `app.public_rounds._side`);
  // a not-yet-materialised preview side has no such key at all, so there
  // is nothing meaningful to expand yet.
  let lineups=('lineup' in m.home)?`<details class="lineups-toggle"><summary>Lineups</summary><div class="lineups">${side(m.home)}${side(m.away)}</div></details>`:'';
  return `<div class="card match ${esc(m.status)}"><div class="status">${esc(m.slot_label)}</div>${scoreline}${note}${lineups}</div>`;
}

function byeCard(bye){
  return `<div class="card match bye"><div class="status">Bye</div><div class="scoreline"><div><strong>${teamLabel({name:bye.team_name,seed:bye.seed})}</strong></div></div></div>`;
}

function superscoreSection(ss){
  let body;
  if(!ss.available){
    body=`<p class="note">${esc(ss.round_label)} is not yet configured for this finals week.</p>`;
  } else if(!ss.published && !ss.entries.length){
    body=`<p class="note">${esc(ss.round_label)} results have not been published yet.</p>`;
  } else {
    let published=auTime(ss.published_at);
    // Issue #261: `total_display` (from `app.public_finals.build_public_
    // superscore_round`) already strips a trailing ".0" off an integral
    // published total (e.g. 271.0 -> "271") while leaving a genuinely
    // non-integral one shown as-is -- never a second/independent rounding
    // rule here, and never a change to the underlying `total_score` value.
    let rows=ss.entries.map(superScoreEntry).join('');
    let status=ss.published?(published?`Published ${esc(published)} (AEST/AEDT)`:'Official final'):'Live/current scores — unofficial';
    body=`<p class="note">${status}</p><div class="superscore-list">${rows}</div>`;
  }
  return `<div class="card"><h2>${esc(ss.round_label)}</h2>${body}</div>`;
}

function superScorePlayer(p){
  let player=esc(p.player_name||'Vacant');
  if(p.interchange_applied){
    let reason=p.confirmed_dnp?' (DNP)':'';
    player+=` <span class="note">${reason} → replaced by ${esc(p.replacement_player_name||'Interchange')}</span>`;
  }
  let score=p.football_line==null?esc(p.effective_score):`${esc(p.football_line)} <span class="tag">(${esc(p.effective_score)})</span>`;
  return `<div class="superscore-player"><strong>${esc(p.label)}</strong><span>${player}</span><span>${esc(p.interchange_applied?p.replacement_afl_club:p.afl_club)||'—'}</span><span class="state">${esc(p.display_state.replaceAll('_',' '))}</span><span>${score}</span></div>`;
}
function superScoreEntry(e){
  const id=String(e.season_entry_id);const open=expandedSuperScoreEntry===id;
  const positions=e.positions||[];
  const dots=positions.map(p=>`<span class="superscore-dot ${esc(p.display_state)}" title="${esc(p.label)}: ${esc(p.display_state.replaceAll('_',' '))}"></span>`).join('');
  const interchange=e.interchange||{};
  const detail=`<div class="superscore-detail" id="superscore-detail-${esc(id)}"${open?'':' hidden'}>${positions.map(superScorePlayer).join('')}<div class="superscore-player"><strong>Interchange</strong><span>${esc(interchange.player_name||'Vacant')}</span><span>${esc(interchange.afl_club)||'—'}</span><span class="state">${esc((interchange.display_state||'vacant').replaceAll('_',' '))}</span><span>${interchange.target_position?`Replaces ${esc(interchange.target_position)}`:'—'}</span></div></div>`;
  return `<div class="superscore-entry"><button type="button" class="superscore-team" data-superscore-entry="${esc(id)}" aria-expanded="${open}" aria-controls="superscore-detail-${esc(id)}"><span class="superscore-rank">${e.rank}${e.is_joint_winner?' =':''}.</span><strong>${esc(e.team_name)}</strong><span class="superscore-total">${e.football_line?`${esc(e.football_line)} `:''}<span class="tag">(${esc(e.total_display)})</span></span><span class="superscore-dots" aria-label="Player progress">${dots}</span></button>${detail}</div>`;
}

document.querySelector('#superscore').addEventListener('click',event=>{
  const button=event.target.closest('[data-superscore-entry]');if(!button)return;
  expandedSuperScoreEntry=button.getAttribute('data-superscore-entry')===expandedSuperScoreEntry?null:button.getAttribute('data-superscore-entry');
  document.querySelectorAll('[data-superscore-entry]').forEach(item=>{
    const open=item.getAttribute('data-superscore-entry')===expandedSuperScoreEntry;
    item.setAttribute('aria-expanded',String(open));item.nextElementSibling.hidden=!open;
  });
});

function renderRoundOptions(rounds){
  const select=document.querySelector('#roundSelect');
  select.innerHTML=rounds.map(r=>`<option value="${r.round_number}"${r.round_number===roundNumber?' selected':''}>${esc(r.label)}${r.published?' ✓':''}</option>`).join('');
}

async function loadRoundIndex(){
  const resp=await fetch(`/api/public/seasons/${encodeURIComponent(season)}/rounds`);
  if(!resp.ok) throw Error('Season data is temporarily unavailable');
  return resp.json();
}

async function loadRound(n){
  const resp=await fetch(apiUrl(n));
  if(!resp.ok) throw Error('Round data is temporarily unavailable');
  return resp.json();
}

async function loadLadder(n){
  const resp=await fetch(apiUrl(n)+'/ladder');
  if(!resp.ok) throw Error('Round data is temporarily unavailable');
  return resp.json();
}

async function render(){
  try{
    const index=await loadRoundIndex();
    renderRoundOptions(index.rounds);
    const round=await loadRound(roundNumber);

    document.querySelector('#heading').textContent=`${round.label} — ${round.published?'Published':round.round_state==='scheduled'?'Scheduled':'In progress'}`;
    document.title=`BBBFFL — ${round.label}`;
    const badge=document.querySelector('#roundBadge');
    badge.innerHTML=round.published?'<span class="badge published">Published</span>':round.round_state==='scheduled'?'<span class="badge scheduled">Scheduled</span>':`<span class="badge">${esc(round.round_state)}</span>`;

    document.querySelector('#prevBtn').disabled = round.prev_round_number===null || round.prev_round_number===undefined;
    document.querySelector('#prevBtn').onclick=()=>{ if(round.prev_round_number) location.href=seasonUrl(round.prev_round_number); };
    document.querySelector('#nextBtn').disabled = round.next_round_number===null || round.next_round_number===undefined;
    document.querySelector('#nextBtn').onclick=()=>{ if(round.next_round_number) location.href=seasonUrl(round.next_round_number); };

    const ladderSection=document.querySelector('#ladder');
    const ssSection=document.querySelector('#superscore');
    if(round.stream==='finals'){
      let cards=[];
      if(round.bye) cards.push(byeCard(round.bye));
      cards=cards.concat(round.matchups.map(finalsMatchCard));
      document.querySelector('#matches').innerHTML=cards.length?cards.join(''):'<p class="note">This finals week is not yet determined.</p>';
      ssSection.style.display='';
      ssSection.innerHTML=superscoreSection(round.superscore);
      ladderSection.style.display='none';
    } else {
      document.querySelector('#matches').innerHTML=round.matchups.map(m=>matchCard(m, round.round_id)).join('');
      ssSection.style.display='none';
      ssSection.innerHTML='';
      ladderSection.style.display='';
      const ladder=await loadLadder(roundNumber);
      document.querySelector('#ladderThrough').textContent=`(through Round ${ladder.through_round})`;
      document.querySelector('#ladder-body').innerHTML=`<table class="ladder"><thead><tr><th>#</th><th>Team</th><th>Pts</th><th>W</th><th>D</th><th>L</th><th class="wide">PF</th><th class="wide">PA</th><th>%</th></tr></thead><tbody>${ladder.rows.map(x=>`<tr><td>${x.rank}</td><td>${esc(x.team_name)}${x.tied?' =':''}</td><td>${x.competition_points}</td><td>${x.wins}</td><td>${x.draws}</td><td>${x.losses}</td><td class="wide">${x.points_for}</td><td class="wide">${x.points_against}</td><td>${Number(x.percentage).toFixed(1)}</td></tr>`).join('')}</tbody></table>`;
    }
    document.querySelector('#error').textContent='';
  }catch(e){
    document.querySelector('#error').textContent=e.message;
  }
}

document.querySelector('#roundSelect').addEventListener('change', e=>{ location.href=seasonUrl(Number(e.target.value)); });
render();
// A finals week has no per-matchup polling detail page of its own to
// fall back on (a direct finals round_id URL redirects back to this
// same page) -- unlike an ordinary round's matches, which link out to
// public_round_centre.html's own polling `load()`. Scheduled here,
// unconditionally on the server-known `isFinalsRound` -- never inside
// `render()`'s own success path -- so a transient failure on the very
// first fetch still gets retried on the next tick, exactly like
// public_round_centre.html's own `load(); setInterval(load, ...)`
// (issue #213 Codex follow-up). Scoped to finals only: an ordinary
// round's page behaviour is unchanged.
if(isFinalsRound){
  setInterval(render, Math.max(pollIntervalMs,5000));
}
</script></body></html>
