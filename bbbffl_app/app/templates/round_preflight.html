<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Round preflight · BBBFFL</title><style>
:root{color-scheme:dark}body{font:15px system-ui;margin:auto;max-width:1100px;padding:22px;background:#0f1115;color:#e7e9ee}a{color:#79c0ff}.card{background:#171a21;border:1px solid #303744;border-radius:11px;padding:17px;margin:14px 0}h1,h2,h3{margin:.2em 0 .6em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.item{background:#11151b;border-radius:8px;padding:12px;margin:7px 0}.muted{color:#aab2c0}.ok{border-left:5px solid #3fb950}.bad{border-left:5px solid #f85149}.warn{border-left:5px solid #d29922}.pill{font-size:.8rem;border:1px solid #596273;border-radius:20px;padding:3px 8px;display:inline-block;margin:2px 4px 2px 0}.pill.on{border-color:#3fb950;color:#3fb950}.pill.pending{border-color:#d29922;color:#d29922}.id{font:12px monospace;color:#8b949e}button,input,select,textarea{font:inherit;padding:8px;border:1px solid #596273;border-radius:6px;background:#222733;color:inherit}button{cursor:pointer}.primary{background:#238636;font-weight:bold}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:end}label{display:grid;gap:4px}.message{white-space:pre-wrap}.message:empty{display:none}.recommend{border-left:5px solid #79c0ff}.checks{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;border:1px solid #303744;border-radius:6px;padding:8px}.checks label{display:flex;flex-direction:row;align-items:center;gap:6px}details summary{cursor:pointer;color:#aab2c0}
</style></head><body><a href="/admin/season-centre">← Season operations</a><h1>Round setup &amp; lockout preflight</h1><p class="muted">What exactly are we opening this week?</p><div id="message" class="card message"></div><main id="app">Loading authoritative round context…</main>
<script>
const roundId={{round_id|tojson}},csrf={{csrf_token|tojson}};let current;const e=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function headers(){const h={'Content-Type':'application/json','X-CSRF-Token':csrf},t=localStorage.getItem('bbbffl_admin_token');if(t)h['X-Admin-Token']=t;return h}async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:headers(),body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}function msg(s,ok=false){let x=document.querySelector('#message');x.textContent=s;x.className='card message '+(ok?'ok':'bad')}
// Human-readable labels first, opaque provider IDs kept only as secondary
// reference (issue #152) -- never the other way around.
const local=iso=>{if(!iso)return'—';try{return new Date(iso).toLocaleString()}catch(_){return iso}};
const matchLabel=m=>`${e(m.home_team)} v ${e(m.away_team)}`;
const seasonLabel=s=>`${e(s.year)} · ${e(s.name||'Unnamed season')}${s.is_current?' (current)':''}`;
const roundLabel=r=>`Round ${e(r.round_number)}`;
const match=m=>`<div class="item"><strong>${matchLabel(m)}</strong> <span class="pill">${e(m.status)}</span><br>
<span class="muted">Scheduled ${e(m.start_time_utc)} UTC · your local time ${e(local(m.start_time_utc))} · AFL Match ${e(m.match_id)} (secondary)</span><br>
${(m.lockout_trigger_coverage||[]).length?m.lockout_trigger_coverage.map(c=>`<span class="pill ${c.activated?'on':'pending'}">${e(c.trigger_type)} ${e(c.trigger_key)} — BBBFFL lockout ${c.activated?'ACTIVATED':'not yet activated'}</span>`).join(''):'<span class="pill">Not covered by any configured trigger</span>'}
</div>`;
function render(d){current=d;const r=d.round,ready=d.readiness.safe_to_open;const mappingRevision=d.mapping?.revision??0;
document.querySelector('#app').innerHTML=`
<section class="card"><h2>Round identity &amp; lifecycle</h2><strong>${e(r.season_label)} · ${e(r.competition_label)} · ${e(r.label)}</strong><p>BBBFFL Round ${e(r.sequence)} <span class="pill">${e(r.lifecycle_state)}</span></p><span class="id">${e(r.bbbffl_round_id)}</span></section>
<section class="card"><h2>BBBFFL fixture</h2><div class="grid">${d.fixture_matchups.map((m,i)=>`<div class="item"><span class="muted">Matchup ${i+1}</span><br><strong>${e(m.home_team_name)} v ${e(m.away_team_name)}</strong></div>`).join('')||'<p class="bad">No authoritative five-match fixture.</p>'}</div></section>
<section class="card"><h2>AFL season &amp; round mapping</h2>
${d.mapping?`<p><strong>Accepted: AFL ${d.mapping_context?.afl_season_year?`season ${e(d.mapping_context.afl_season_year)}`:`season id ${e(d.mapping.afl_season_id)}`} · ${d.mapping_context?.afl_round_number?`round ${e(d.mapping_context.afl_round_number)}`:`round id ${e(d.mapping.afl_round_id)}`}</strong> <span class="pill">revision ${e(d.mapping.revision)}</span><br><span class="id">AFL season id ${e(d.mapping.afl_season_id)} · AFL round id ${e(d.mapping.afl_round_id)} (secondary/reference)</span></p>`:'<p>No accepted mapping yet.</p>'}
${d.mapping_recommendation?`<div class="item recommend"><strong>Recommended (advisory only): AFL season ${e(d.mapping_recommendation.afl_season_year)} · round ${e(d.mapping_recommendation.afl_round_number)}</strong><br><span class="muted">${e(d.mapping_recommendation.evidence)}</span><br><button type="button" id="use-mapping-recommendation">Use recommended values</button></div>`:'<p class="muted">No confident recommendation is available from current evidence — BBBFFL and AFL round numbering can legitimately diverge, so none is guessed.</p>'}
<form id="mapping" class="actions">
<label>AFL season<select name="season_select"><option value="">Choose a season…</option>${(d.afl_seasons||[]).map(s=>`<option value="${e(s.season_id)}">${seasonLabel(s)} (id ${e(s.season_id)})</option>`).join('')}</select></label>
<label>AFL round<select name="round_select" disabled><option value="">Choose a season first…</option></select></label>
<details><summary>Advanced: manual AFL season/round IDs</summary>
<label>AFL season ID (manual)<input name="season_manual" type="number"></label>
<label>AFL round ID (manual)<input name="round_manual" type="number"></label>
</details>
<label>Reason (required)<input name="reason" placeholder="Why this mapping?" required></label>
<label><input type="checkbox" name="confirmed"> I have reviewed the evidence above and explicitly confirm this mapping, including any deliberate divergence from the recommendation.</label>
<button>Confirm mapping</button>
</form></section>
<section class="card ${d.afl_evidence_fresh?'':'warn'}"><h2>Relevant AFL matches (scheduled-start order)</h2>${d.afl_evidence_fresh?'':'<p><strong>Stale cached evidence — diagnostic only. Opening is blocked.</strong></p>'}${d.afl_matches.map(match).join('')||'<p class="muted">Matches cannot be shown until mapping evidence resolves.</p>'}</section>
<section class="card"><h2>Lockout plan</h2><p class="muted">Selecting from the mapped matches above is authoritative once submitted; the activating AFL-match relationship remains authoritative and server-validated.</p>
${d.lockout_triggers.map(t=>`<div class="item"><strong>${e(t.trigger_type==='main'?'Main / remaining lockout':'Selective lockout')} · ${e(t.trigger_key)}</strong> <span class="pill">sequence ${e(t.sequence)}</span> <span class="pill">revision ${e(t.revision)}</span><p>${e(t.scope)}${t.participating_clubs?.length?` — ${t.participating_clubs.map(e).join(', ')}`:''}</p><p><span class="pill ${t.activation.activated?'on':'pending'}">BBBFFL lockout ${t.activation.activated?`ACTIVATED (${e(t.activation.activation_reason)} at ${e(t.activation.effective_lock_at)})`:'not yet activated'}</span></p>${t.activating_matches.map(m=>m.unresolved?`<span class="bad">Unresolved AFL Match ${e(m.match_id)}</span>`:match(m)).join('')}</div>`).join('')||'<p>No triggers configured.</p>'}
${d.lockout_recommendation?`<div class="item recommend"><strong>Recommended plan (advisory only, never auto-persisted):</strong>${d.lockout_recommendation.stages.map(s=>`<p>${e(s.trigger_type==='main'?'Main/remaining':'Selective')} · matches ${s.afl_match_ids.map(e).join(', ')} — ${e(s.evidence)} <button type="button" class="use-lockout-stage" data-stage='${JSON.stringify(s).replace(/'/g,"&#39;")}'>Use this stage</button></p>`).join('')}</div>`:''}
<form id="trigger" class="actions">
<label>Key<input name="key" placeholder="early-1 or main" required></label>
<label>Type<select name="type"><option value="selective">Selective</option><option value="main">Main / remaining</option></select></label>
<label>Sequence<input name="sequence" type="number" value="1" required></label>
<div><span class="muted">Activating AFL match(es) (from the mapping above)</span><div class="checks">${d.afl_matches.map(m=>`<label><input type="checkbox" name="matches" value="${e(m.match_id)}"> ${matchLabel(m)} <span class="muted">(AFL Match ${e(m.match_id)}, ${e(m.status)})</span></label>`).join('')||'<span class="muted">No mapped matches available yet.</span>'}</div></div>
<label>Reason<input name="reason" placeholder="Configured during operator preflight"></label>
<button>Configure trigger</button>
</form></section>
${(d.replay_checkpoint_recommendations||[]).length?`<section class="card"><h2>Replay checkpoint recommendations (advisory only)</h2><p class="muted">These are suggestions only — nothing here mutates replay checkpoint files or the replay clock. Apply a checkpoint, if desired, through the existing replay checkpoint tooling.</p>${d.replay_checkpoint_recommendations.map(c=>`<div class="item"><strong>${e(c.label)}</strong> <span class="pill">${e(c.stage)}</span><br><span class="muted">Recommended effective time ${e(c.recommended_effective_at)} — ${e(c.evidence)}</span></div>`).join('')}</section>`:''}
${d.opening_round.applies?`<section class="card warn"><h2>Opening Round exceptions</h2><p>Readiness includes these deferred/preloaded slots and their compensating-bye source.</p>${d.opening_round.deferred_selections.map(n=>`<div class="item"><strong>${e(n.team_name)} · ${e(n.player_display_name)} — ${e(n.afl_club_name)} · slot ${e(n.position)} · locked/deferred</strong><br>${e(n.rule_display_label)}<br>Source ${e(n.afl_opening_round_label)} (AFL Match ${e(n.source_afl_match_id)}) → compensating ${e(n.afl_bye_round_label)} → target ${e(n.bbbffl_round_label)}<br><span class="muted">Evidence ${e(n.evidence_classification)} · entered by ${e(n.actor_id)} (${e(n.actor_role)}). Replay operator input is not attributed to the represented coach.</span><details><summary class="muted">Internal identifiers</summary><span class="id">nomination ${e(n.nomination_id)} · rule ${e(n.rule_id)} · player ${e(n.season_player_id)} · target round ${e(n.bbbffl_round_id)}</span></details></div>`).join('')}</section>`:''}
<section class="card ${ready?'ok':'bad'}"><h2>Readiness</h2><h3>${ready?'Safe to open':'Not safe to open'}</h3>${d.readiness.blockers.map(x=>`<div class="item bad"><strong>Blocking</strong> · ${e(x.message)}${x.url?` <a href="${e(x.url)}">Go to Opening Round Operations →</a>`:''}</div>`).join('')}${d.readiness.advisories.map(x=>`<div class="item warn"><strong>Advisory</strong> · ${e(x.message)}</div>`).join('')}<button class="primary" id="open" ${ready?'':'disabled'}>Open Round</button><p class="muted">This persists the authoritative BBBFFL lifecycle; it is not a browser-only flag.</p></section>`;
document.querySelector('#mapping').onsubmit=map;document.querySelector('#trigger').onsubmit=trigger;document.querySelector('#open').onclick=openRound;
document.querySelector('select[name="season_select"]').onchange=onSeasonChange;
document.querySelector('#use-mapping-recommendation')?.addEventListener('click',useMappingRecommendation);
document.querySelectorAll('.use-lockout-stage').forEach(b=>b.addEventListener('click',()=>useLockoutStage(JSON.parse(b.dataset.stage))));
}
async function onSeasonChange(x){
  const seasonId=x.target.value,roundSelect=document.querySelector('select[name="round_select"]');
  if(!seasonId){roundSelect.innerHTML='<option value="">Choose a season first…</option>';roundSelect.disabled=true;return}
  roundSelect.disabled=true;roundSelect.innerHTML='<option value="">Loading rounds…</option>';
  try{
    const d=await api(`/api/admin/round-preflight/${roundId}/afl-seasons/${seasonId}/afl-rounds`);
    roundSelect.innerHTML='<option value="">Choose a round…</option>'+d.afl_rounds.map(r=>`<option value="${e(r.round_id)}">${roundLabel(r)} (id ${e(r.round_id)})</option>`).join('');
    roundSelect.disabled=false;
  }catch(err){roundSelect.innerHTML='<option value="">Round list unavailable</option>'}
}
function useMappingRecommendation(){
  const rec=current.mapping_recommendation;if(!rec)return;
  const form=document.querySelector('#mapping');
  form.season_manual.value=rec.afl_season_id;form.round_manual.value=rec.afl_round_id;
  // Advisory fill only -- never submits. The operator must still review,
  // confirm, give a reason, and explicitly click "Confirm mapping".
}
function useLockoutStage(stage){
  const form=document.querySelector('#trigger');
  form.key.value=stage.trigger_key;form.type.value=stage.trigger_type;form.sequence.value=stage.sequence;
  form.querySelectorAll('input[name="matches"]').forEach(cb=>{cb.checked=stage.afl_match_ids.includes(+cb.value)});
  // Advisory fill only -- never submits; the operator must still click
  // "Configure trigger" explicitly for each stage they choose to adopt.
}
// A rejected/stale mutation must never leave the previous render looking
// current: reload the authoritative preflight view (a plain GET, never a
// repeat of the rejected mutation) so readiness/blockers/mapping/lockout
// state shown can never drift from what the server actually holds. If
// that reload itself fails (e.g. a transient outage), the caller must
// never claim the page was refreshed -- reloadAfterFailure reports
// whether it actually succeeded, and reloadNotice's wording reflects it.
async function reloadAfterFailure(){try{render(await api(`/api/admin/round-preflight/${roundId}`));return true}catch(_){return false}}
function reloadNotice(reloaded){return reloaded?'Current authoritative state has been reloaded.':'The authoritative state could NOT be reloaded -- treat this page as out of date and reload manually before retrying.'}
async function map(x){
  x.preventDefault();
  let f=new FormData(x.target),seasonManual=f.get('season_manual'),roundManual=f.get('round_manual'),
    season=(seasonManual&&roundManual)?seasonManual:f.get('season_select'),
    round=(seasonManual&&roundManual)?roundManual:f.get('round_select'),
    reason=f.get('reason'),confirmed=x.target.confirmed.checked,
    // An accepted mapping isn't the only prior state worth guarding: an
    // unresolved/ambiguous proposal already occupies revision 1+ even
    // though `current.mapping` (the *accepted* mapping only) is null, so
    // falling back to a bare 0 there would make the round-mapping row's
    // real current revision look stale forever and permanently reject the
    // operator's explicit accept.
    expectedRevision=current.mapping?.revision??(current.mapping_history.length?current.mapping_history[current.mapping_history.length-1].revision:0);
  try{
    render(await api(`/api/admin/round-preflight/${roundId}/mapping`,{afl_season_id:+season,afl_round_id:+round,reason:reason||null,confirmed,expected_revision:expectedRevision}));
    msg('Authoritative mapping confirmed.',true)
  }catch(x){
    const reloaded=await reloadAfterFailure();
    // Recoverable validation failure: retyping reason is safe (it names
    // nothing that could now be stale) and worth preserving.
    const form=document.querySelector('#mapping');
    if(form){form.reason.value=reason}
    msg('Mapping NOT confirmed — '+x.message+' '+reloadNotice(reloaded))
  }
}
async function trigger(x){
  x.preventDefault();
  let f=new FormData(x.target),key=f.get('key'),type=f.get('type'),sequence=f.get('sequence'),
    matches=Array.from(x.target.querySelectorAll('input[name="matches"]:checked')).map(cb=>+cb.value),
    reason=f.get('reason'),
    existing=(current.lockout_triggers||[]).find(t=>t.trigger_key===key),
    expectedRevision=existing?existing.revision:0;
  try{
    render(await api(`/api/admin/round-preflight/${roundId}/lockout-trigger`,{trigger_key:key,trigger_type:type,sequence:+sequence,afl_match_ids:matches,reason:reason||null,expected_revision:expectedRevision}));
    msg('Lockout trigger persisted.',true)
  }catch(x){
    const reloaded=await reloadAfterFailure();
    const form=document.querySelector('#trigger');
    if(form){form.key.value=key;form.type.value=type;form.sequence.value=sequence}
    msg('Lockout trigger NOT persisted — '+x.message+' '+reloadNotice(reloaded))
  }
}
async function openRound(){
  if(!confirm('Open this BBBFFL round for coach team selection?'))return;
  try{
    render(await api(`/api/admin/round-preflight/${roundId}/open`,{}));
    msg('Round opened. Coaches may now use the weekly selection workflow.',true)
  }catch(x){
    const reloaded=await reloadAfterFailure();
    msg('Round NOT opened — '+x.message+' '+reloadNotice(reloaded))
  }
}
api(`/api/admin/round-preflight/${roundId}`).then(render).catch(x=>msg(x.message));
</script></body></html>
