<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Round preflight · BBBFFL</title><style>
:root{color-scheme:dark}body{font:15px system-ui;margin:auto;max-width:1100px;padding:22px;background:#0f1115;color:#e7e9ee}a{color:#79c0ff}.card{background:#171a21;border:1px solid #303744;border-radius:11px;padding:17px;margin:14px 0}h1,h2{margin:.2em 0 .6em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.item{background:#11151b;border-radius:8px;padding:12px;margin:7px 0}.muted{color:#aab2c0}.ok{border-left:5px solid #3fb950}.bad{border-left:5px solid #f85149}.warn{border-left:5px solid #d29922}.pill{font-size:.8rem;border:1px solid #596273;border-radius:20px;padding:3px 8px}.id{font:12px monospace;color:#8b949e}button,input,select{font:inherit;padding:8px;border:1px solid #596273;border-radius:6px;background:#222733;color:inherit}button{cursor:pointer}.primary{background:#238636;font-weight:bold}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:end}label{display:grid;gap:4px}.message{white-space:pre-wrap}.message:empty{display:none}
</style></head><body><a href="/admin/season-centre">← Season operations</a><h1>Round setup &amp; lockout preflight</h1><p class="muted">What exactly are we opening this week?</p><div id="message" class="card message"></div><main id="app">Loading authoritative round context…</main>
<script>
const roundId={{round_id|tojson}},csrf={{csrf_token|tojson}};let current;const e=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function headers(){const h={'Content-Type':'application/json','X-CSRF-Token':csrf},t=localStorage.getItem('bbbffl_admin_token');if(t)h['X-Admin-Token']=t;return h}async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:headers(),body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}function msg(s,ok=false){let x=document.querySelector('#message');x.textContent=s;x.className='card message '+(ok?'ok':'bad')}
const match=m=>`<div class="item"><strong>${e(m.home_team)} v ${e(m.away_team)}</strong> <span class="pill">${e(m.status)}</span><br><span class="muted">${e(m.start_time_utc)} · AFL Match ${e(m.match_id)}</span></div>`;
function render(d){current=d;const r=d.round,ready=d.readiness.safe_to_open;document.querySelector('#app').innerHTML=`
<section class="card"><h2>Round identity &amp; lifecycle</h2><strong>${e(r.season_label)} · ${e(r.competition_label)} · ${e(r.label)}</strong><p>BBBFFL Round ${e(r.sequence)} <span class="pill">${e(r.lifecycle_state)}</span></p><span class="id">${e(r.bbbffl_round_id)}</span></section>
<section class="card"><h2>BBBFFL fixture</h2><div class="grid">${d.fixture_matchups.map((m,i)=>`<div class="item"><span class="muted">Matchup ${i+1}</span><br><strong>${e(m.home_team_name)} v ${e(m.away_team_name)}</strong></div>`).join('')||'<p class="bad">No authoritative five-match fixture.</p>'}</div></section>
<section class="card"><h2>AFL mapping</h2>${d.mapping?`<p><strong>AFL season ${e(d.mapping.afl_season_id)} · AFL round ${e(d.mapping.afl_round_id)}</strong> <span class="pill">accepted revision ${e(d.mapping.revision)}</span></p>`:'<p>No accepted mapping.</p>'}<form id="mapping" class="actions"><label>AFL season ID<input name="season" type="number" required value="${e(d.mapping?.afl_season_id??'')}"></label><label>AFL round ID<input name="round" type="number" required value="${e(d.mapping?.afl_round_id??'')}"></label><label>Decision reason<input name="reason" placeholder="Why this mapping?"></label><button>Confirm mapping</button></form></section>
<section class="card ${d.afl_evidence_fresh?'':'warn'}"><h2>Relevant AFL matches</h2>${d.afl_evidence_fresh?'':'<p><strong>Stale cached evidence — diagnostic only. Opening is blocked.</strong></p>'}${d.afl_matches.map(match).join('')||'<p class="muted">Matches cannot be shown until mapping evidence resolves.</p>'}</section>
<section class="card"><h2>Lockout plan</h2><p class="muted">Timestamps below come from AFL scheduling evidence. The activating AFL-match relationship remains authoritative.</p>${d.lockout_triggers.map(t=>`<div class="item"><strong>${e(t.trigger_type==='main'?'Main / remaining lockout':'Selective lockout')} · ${e(t.trigger_key)}</strong><p>${e(t.scope)}</p>${t.activating_matches.map(m=>m.unresolved?`<span class="bad">Unresolved AFL Match ${e(m.match_id)}</span>`:match(m)).join('')}</div>`).join('')||'<p>No triggers configured.</p>'}<form id="trigger" class="actions"><label>Key<input name="key" placeholder="early-1 or main" required></label><label>Type<select name="type"><option value="selective">Selective</option><option value="main">Main / remaining</option></select></label><label>Sequence<input name="sequence" type="number" value="1" required></label><label>Activating match IDs<input name="matches" placeholder="101, 102" required></label><button>Configure trigger</button></form></section>
${d.opening_round.applies?`<section class="card warn"><h2>Opening Round exceptions</h2><p>Readiness includes these deferred/preloaded slots and their compensating-bye source.</p>${d.opening_round.deferred_selections.map(n=>`<div class="item"><strong>${e(n.team_name)} · ${e(n.position)}</strong><br>Preloaded player ${e(n.season_player_id)} from AFL Match ${e(n.source_afl_match_id)}<br><span class="muted">Compensating bye: AFL round ${e(n.afl_bye_round_id)}</span></div>`).join('')}</section>`:''}
<section class="card ${ready?'ok':'bad'}"><h2>Readiness</h2><h3>${ready?'Safe to open':'Not safe to open'}</h3>${d.readiness.blockers.map(x=>`<div class="item bad"><strong>Blocking</strong> · ${e(x.message)}</div>`).join('')}${d.readiness.advisories.map(x=>`<div class="item warn"><strong>Advisory</strong> · ${e(x.message)}</div>`).join('')}<button class="primary" id="open" ${ready?'':'disabled'}>Open Round</button><p class="muted">This persists the authoritative BBBFFL lifecycle; it is not a browser-only flag.</p></section>`;
document.querySelector('#mapping').onsubmit=map;document.querySelector('#trigger').onsubmit=trigger;document.querySelector('#open').onclick=openRound}
async function map(x){x.preventDefault();let f=new FormData(x.target);try{render(await api(`/api/admin/round-preflight/${roundId}/mapping`,{afl_season_id:+f.get('season'),afl_round_id:+f.get('round'),reason:f.get('reason')||null}));msg('Authoritative mapping confirmed.',true)}catch(x){msg(x.message)}}async function trigger(x){x.preventDefault();let f=new FormData(x.target);try{render(await api(`/api/admin/round-preflight/${roundId}/lockout-trigger`,{trigger_key:f.get('key'),trigger_type:f.get('type'),sequence:+f.get('sequence'),afl_match_ids:f.get('matches').split(',').map(Number),reason:'Configured during operator preflight'}));msg('Lockout trigger persisted.',true)}catch(x){msg(x.message)}}async function openRound(){if(!confirm('Open this BBBFFL round for coach team selection?'))return;try{render(await api(`/api/admin/round-preflight/${roundId}/open`,{}));msg('Round opened. Coaches may now use the weekly selection workflow.',true)}catch(x){msg(x.message)}}api(`/api/admin/round-preflight/${roundId}`).then(render).catch(x=>msg(x.message));
</script></body></html>
