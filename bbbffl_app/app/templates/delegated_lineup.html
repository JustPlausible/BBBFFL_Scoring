<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delegated weekly lineup · BBBFFL</title><style>
:root{color-scheme:dark}body{font:15px system-ui;margin:auto;max-width:1050px;padding:22px;background:#0f1115;color:#e7e9ee}a{color:#79c0ff}.card{background:#171a21;border:1px solid #303744;border-radius:11px;padding:17px;margin:14px 0}.banner{border:3px solid #d29922;background:#2b2414}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.slot{background:#11151b;border-radius:8px;padding:11px}.locked{border:2px solid #d29922}label{display:grid;gap:5px}button,input,select{font:inherit;padding:8px;border:1px solid #596273;border-radius:6px;background:#222733;color:inherit}button{cursor:pointer}.primary{background:#238636;font-weight:bold}.danger{background:#9e2a2b}.muted{color:#aab2c0}.message:empty{display:none}.positions{font:12px monospace;white-space:pre-wrap}
</style></head><body>
<nav><a href="/admin/round-preflight">← Round preflight</a> · <a href="/admin/round-review">Scorer / round review</a></nav>
<h1>Delegated weekly lineup</h1><div id="message" class="card message"></div><main id="app">Loading authorised acting context…</main>
<script>
const roundId={{round_id|tojson}},csrf={{csrf_token|tojson}};let state;const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}function msg(s,ok=false){let n=document.querySelector('#message');n.textContent=s;n.style.borderColor=ok?'#3fb950':'#f85149'}
function render(d){state=d;let c=d.acting_context;document.querySelector('#app').innerHTML=`
<section class="card banner"><strong>PROXY / DELEGATED OPERATION</strong><div class="grid"><p><b>Signed in as:</b> ${esc(c.display_name)}</p><p><b>Role:</b> ${esc(c.active_role)}</p><p><b>Representing:</b> ${esc(c.team_name)}</p><p><b>Season / round:</b> ${esc(d.season.label)} · ${esc(d.round.label)}</p></div><p>The signed-in human remains the audit actor. The represented team is the target, not the authenticated identity.</p><label>Switch represented team<select id="entry"><option value="">Loading authorised teams…</option></select></label></section>
<section class="card"><h2>Selection</h2><div class="grid">${Object.entries(d.draft.positions).map(([p,v])=>{let lock=d.deferred[p];return `<label class="slot ${lock?'locked':''}"><b>${esc(p)}</b>${lock?`<span>Opening Round deferred — locked</span><small>Source AFL Opening Round ${esc(lock.afl_opening_round_id)} · match ${esc(lock.source_afl_match_id)}</small><input disabled value="${esc(v)}">`:`<select data-position="${esc(p)}"><option value="">Vacant</option>${d.players.map(x=>`<option value="${esc(x.season_player_id)}" ${v===x.season_player_id?'selected':''}>${esc(x.display_name||x.name||x.season_player_id)}</option>`).join('')}</select>`}</label>`}).join('')}</div><p><label>Operator reason<input id="reason" value="First-half replay delegated lineup entry" required></label></p><button id="save">Save proxy draft</button> <button class="primary" id="submit">Submit / resubmit</button><p class="muted">Vacant means deliberately vacant; no placeholder or DNP is created. Submission asks for explicit confirmation.</p></section>
<section class="card"><h2>Carry forward previous submitted lineup</h2>${d.carry_forward_source?`<p>Source round <b>${esc(d.carry_forward_source.source_bbbffl_round_id)}</b>, lineup ${esc(d.carry_forward_source.source_lineup_id)}, version ${esc(d.carry_forward_source.source_version)}</p><div class="positions">${esc(JSON.stringify(d.carry_forward_source.positions,null,2))}</div><button id="carry">Carry forward exact positions</button>`:`<strong>${esc(d.carry_forward_message)}</strong>`}</section>`;
document.querySelector('#save').onclick=save;document.querySelector('#submit').onclick=submit;document.querySelector('#carry')?.addEventListener('click',carry);loadEntries(c)}
function positions(){let p={...state.draft.positions};document.querySelectorAll('[data-position]').forEach(x=>p[x.dataset.position]=x.value||null);return p}async function save(){try{render(await api(`/api/operations/rounds/${roundId}/lineup/draft`,'PUT',{positions:positions(),expected_revision:state.draft.revision}));msg('Proxy draft saved.',true)}catch(e){msg(e.message)}}async function submit(){let visible=positions(),vacancies=Object.entries(visible).filter(([p,v])=>p!=='Interchange'&&!v).map(x=>x[0]);if(vacancies.length&&!confirm(`Submit with deliberate vacancies: ${vacancies.join(', ')}?`))return;try{render(await api(`/api/operations/rounds/${roundId}/lineup/submit`,'POST',{positions:visible,expected_draft_revision:state.draft.revision,expected_submission_version:state.submission?.version||0,reason:document.querySelector('#reason').value}));msg('Authoritative scorer_proxy submission created.',true)}catch(e){msg(e.message)}}async function carry(){if(!confirm('Copy the displayed source exactly, position for position?'))return;try{render(await api(`/api/operations/rounds/${roundId}/lineup/carry-forward`,'POST',{expected_submission_version:state.submission?.version||0,reason:'Explicit first-half replay carry-forward'}));msg('Exact carry-forward submission created.',true)}catch(e){msg(e.message)}}
async function loadEntries(c){try{let entries=await api(`/api/context/entries?season_id=${encodeURIComponent(state.season.season_id)}`),s=document.querySelector('#entry');s.innerHTML=entries.map(x=>`<option value="${esc(x.season_entry_id)}" ${x.season_entry_id===c.represented_season_entry_id?'selected':''}>${esc(x.team_name)}</option>`).join('');s.onchange=async()=>{try{await api('/api/context/represented-entry','POST',{season_entry_id:s.value});location.reload()}catch(e){msg(e.message)}}}catch(e){msg(e.message)}}api(`/api/operations/rounds/${roundId}/lineup`).then(render).catch(e=>msg(e.message));
</script></body></html>
