# Production deployment topology for BBBFFL (issue #243). See
# docs/production-operations.md for the full operator procedure --
# clean-host reproduction, secrets setup, TLS, scheduled backups, restore
# rehearsal, and the release/rollback runbook. Do not run this from
# prose/memory; that document is the source of truth for the commands.
#
# Reproducible on a clean Docker-capable host with only:
#   - this repository checked out;
#   - bbbffl_app/.env.production (copied from .env.production.example and
#     filled in -- never committed, see bbbffl_app/.gitignore);
#   - deploy/production/Caddyfile (copied from Caddyfile.example, with its
#     placeholder domain replaced by the real one -- Caddy needs no
#     secret/production env at all, see "proxy" below);
#   - DNS for that domain already pointing at this host, and ports 80/443
#     reachable from the internet (for Let's Encrypt + real traffic).
#
# Topology: app (this repository's image) <- proxy (Caddy, TLS
# termination) is the only service reachable from outside this host;
# database (PostgreSQL) and backup are never published -- see each
# service's own comment below for why.
services:
  app:
    build:
      context: ./bbbffl_app
    # Tag every build with a release identifier (default: latest) so a
    # rollback can re-run `up -d` against a previously built tag without
    # rebuilding -- see docs/production-operations.md#release-procedure.
    # Set before build/up, e.g.: export BBBFFL_RELEASE_TAG=$(git rev-parse --short HEAD)
    image: bbbffl-app:${BBBFFL_RELEASE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./bbbffl_app/.env.production
    # --forwarded-allow-ips=*: trusts the X-Forwarded-For/-Proto headers
    # "proxy" sets on every request (issue #243 review). Safe specifically
    # because "app" is never published (see "expose" below) -- "proxy" is
    # the *only* thing that can reach it on this compose network, so
    # trusting every request that arrives here is equivalent to trusting
    # only proxy, not an open trust grant. Without this, Uvicorn's default
    # (trust only 127.0.0.1) makes every request's client address resolve
    # to proxy's own container IP -- collapsing app/auth_rate_limit.py's
    # per-IP login-attempt limiter into one shared bucket for every coach,
    # so five failed logins from any one of them locks out all of them.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--forwarded-allow-ips=*"]
    # Never published to the host -- only the "proxy" service is reachable
    # from outside this host (see "proxy" below). Other services on this
    # compose project reach it by service name ("app") on the project's
    # default network.
    expose:
      - "8000"
    depends_on:
      database:
        condition: service_healthy
    # Liveness only (Dockerfile's own HEALTHCHECK hits GET /health) --
    # deliberately not GET /health/ready, so a transient afl-api or
    # database outage never looks like a crashed process and triggers a
    # restart-loop that would not fix the outage. See
    # docs/production-operations.md#readiness-vs-liveness.
    volumes:
      - production-app-data:/app/data
    # "backend" reaches "database"; "frontend" is what "proxy" also joins
    # (see "proxy" below) -- app is the only service that needs both.
    networks: [frontend, backend]

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./bbbffl_app/.env.production
    volumes:
      - production-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Deliberately no "ports:" -- PostgreSQL is reachable only from other
    # services on this compose project's internal network, never from the
    # host or the public internet (issue #243's "must not expose
    # PostgreSQL publicly"). "backend"-only (issue #243 review): "proxy",
    # the one service exposed to the internet, is never even on the same
    # Docker network as this one, so a compromised proxy has no network
    # path to the database at all, not merely no credential for it.
    networks: [backend]

  # Scheduled PostgreSQL backups (issue #243). Built from the exact same
  # postgres:16-alpine image as "database" above, so pg_dump's version
  # always matches the server it backs up. See
  # docs/production-operations.md#scheduled-backups for the schedule,
  # retention policy, and the restore procedure these backups feed.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./bbbffl_app/.env.production
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["/scripts/backup_entrypoint.sh"]
    # A cron child job's exit code does not change this container's own
    # status (PID 1 stays the foreground crond daemon regardless), so a
    # backup that has silently stopped succeeding would otherwise be
    # visible only in logs or an optional webhook. This makes
    # `docker compose ps` itself report "unhealthy" once no successful
    # backup is newer than BBBFFL_BACKUP_MAX_AGE_HOURS -- see
    # deploy/production/scripts/check_backup_freshness.sh and
    # docs/production-operations.md#scheduled-backups. start_period covers
    # the time before the first scheduled backup has ever run; an operator
    # changing BBBFFL_BACKUP_SCHEDULE to something less frequent than daily
    # must widen both BBBFFL_BACKUP_MAX_AGE_HOURS and start_period to match.
    healthcheck:
      test: ["CMD", "/scripts/check_backup_freshness.sh"]
      interval: 1h
      timeout: 10s
      start_period: 26h
      retries: 1
    volumes:
      - ./deploy/production/scripts:/scripts:ro
      - ./deploy/production/backups:/backups
    # No "ports:" -- this service only ever initiates outbound
    # pg_dump/pg_restore connections to "database" and, optionally, an
    # outbound alert-webhook request; it is never a server itself.
    # "backend"-only, same reasoning as "database" above -- this service
    # only ever needs to reach "database", never "proxy" or the internet-
    # facing network.
    networks: [backend]

  # Reverse proxy / TLS termination (issue #243). The only service exposed
  # to the host/internet -- see deploy/production/Caddyfile.example for
  # what it forwards, which headers it preserves, and the HTTPS approach.
  # Deliberately no "env_file:" here (issue #243 review): Caddy needs no
  # application secret or setting at all -- the production domain is a
  # literal value in deploy/production/Caddyfile, edited in place when it
  # is copied from Caddyfile.example, not injected from
  # bbbffl_app/.env.production. Giving this internet-facing service the
  # full production secrets file (POSTGRES_PASSWORD, BBBFFL_ADMIN_TOKEN,
  # BBBFFL_SESSION_SECRET, AFL_API_KEY, the alert webhook) would mean a
  # compromise of the one service exposed to the internet yields every
  # other credential too, for no operational benefit.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - production-proxy-data:/data
      - production-proxy-config:/config
    # "frontend"-only (issue #243 review): proxy can reach "app" (also on
    # "frontend") but has no network path to "database"/"backup" at all --
    # see "database"'s own comment.
    networks: [frontend]

networks:
  frontend:
  backend:

volumes:
  # PostgreSQL's own data directory -- the database's persistent state.
  production-database:
  # The season model's authoritative store is PostgreSQL above; this only
  # holds the legacy Grand Final prototype's teams config path mount point
  # (app/config.py's BBBFFL_TEAMS_CONFIG_PATH) and any other file the app
  # image expects under /app/data -- see bbbffl_app/Dockerfile.
  production-app-data:
  # Caddy's certificate storage (Let's Encrypt account key + issued certs)
  # and its runtime config -- both must survive a container
  # restart/recreate so a certificate is not re-requested unnecessarily.
  production-proxy-data:
  production-proxy-config:
