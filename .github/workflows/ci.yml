name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bbbffl_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            bbbffl_app/requirements.txt
            bbbffl_app/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build BBBFFL image
        run: docker build -t bbbffl-prototype ./bbbffl_app

  postgres-migrations:
    name: PostgreSQL migrations and repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bbbffl
          POSTGRES_PASSWORD: bbbffl
          POSTGRES_DB: bbbffl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bbbffl -d bbbffl_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: bbbffl_app
    env:
      BBBFFL_DATABASE_URL: postgresql+psycopg://bbbffl:bbbffl@localhost:5432/bbbffl_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bbbffl_app/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade twice and exercise scorer persistence and audit boundary
        run: |
          python -m app.migrations upgrade 0007_fixture
          python - <<'PY'
          import os
          from sqlalchemy import text
          from app.db import connect
          from app.season import SeasonRepository

          connection = connect(os.environ["BBBFFL_DATABASE_URL"])
          seasons = SeasonRepository(connection)
          season = seasons.create_season(2026, "2026 migration replay")
          rules = seasons.create_rules_version(season.season_id, "ci", 1, "CI")
          competition = seasons.create_competition(season.season_id, rules.rules_version_id, "ci", "CI", "ordinary")
          round_ = seasons.create_round(competition.competition_id, "r1", "Round 1", 1)
          with connection.engine.begin() as raw:
              raw.execute(text("INSERT INTO bbbffl_round_afl_reference VALUES ('ci-legacy-map', :round, 'afl-api-v1', 84, 1300, 't')"), {"round": round_.bbbffl_round_id})
          PY
          python -m app.migrations upgrade
          python -m app.migrations upgrade
          python - <<'PY'
          import os
          from app.db import DecisionsRepository, connect
          from app.audit import ActorContext, AuditEventRepository
          from app.fixtures import FixtureRepository
          from app.identity import IdentityRepository
          from app.season import SeasonRepository
          from app.round_mapping import RoundMappingRepository
          from sqlalchemy.exc import DBAPIError, IntegrityError

          connection = connect(os.environ["BBBFFL_DATABASE_URL"])
          migrated_round = connection.execute("SELECT bbbffl_round_id FROM round_afl_mapping WHERE mapping_id='ci-legacy-map'").fetchone()
          resolved = RoundMappingRepository(connection).resolve(migrated_round["bbbffl_round_id"])
          assert resolved and resolved.afl_season_id == 84 and resolved.afl_round_id == 1300
          assert "bbbffl_round_afl_reference" not in {row["tablename"] for row in connection.execute("SELECT tablename FROM pg_tables WHERE schemaname='public'").fetchall()}
          repository = DecisionsRepository(connection)
          repository.set_dnp("ci-team", "Forward1", True, actor=ActorContext.anonymous_operator(role="scorer"))
          assert repository.get_dnp_map() == {("ci-team", "Forward1"): True}

          events = AuditEventRepository(connection).list_events(entity_type="scoring.slot")
          assert len(events) == 1 and events[0].after_state == {"dnp": True}

          try:
              connection.execute(
                  "UPDATE audit_event SET reason = 'tampered' WHERE event_id = ?", (events[0].event_id,)
              )
              raise SystemExit("audit_event accepted an UPDATE on PostgreSQL -- append-only trigger regressed")
          except IntegrityError:
              pass

          # PostgreSQL regression: an UPDATE must not move either kind of
          # child row out of a frozen draw, even when its draft destination
          # has been vacated and every foreign key would otherwise be valid.
          identities = IdentityRepository(connection)
          seasons = SeasonRepository(connection)
          fixture_repository = FixtureRepository(connection)
          draws = []
          entries_by_season = []
          # Keep this independent from the 2026 season seeded above for the
          # legacy-mapping upgrade regression. Season years are intentionally
          # unique domain identities, so this fixture uses its own test years.
          for year in (2027, 2028):
              season = seasons.create_season(year, str(year))
              entries = []
              for number in range(1, 11):
                  coach = identities.create_coach(f"CI Coach {year}-{number}")
                  entries.append(identities.create_entry(season.season_id, f"ci-{number}", coach.coach_id, f"CI Team {number}"))
              entries_by_season.append(entries)
              draws.append(fixture_repository.save_draft(season.season_id, [entry.season_entry_id for entry in entries]))
          fixture_repository.freeze(draws[0].season_id)
          rejected_tables = []
          for table, key, participant_update, participants in (
              (
                  "season_fixture_number",
                  "fixture_number=1",
                  "season_entry_id=?",
                  (entries_by_season[1][0].season_entry_id,),
              ),
              (
                  "season_fixture_matchup",
                  "bbbffl_round_number=1 AND matchup_order=1",
                  "home_season_entry_id=?, away_season_entry_id=?",
                  (
                      entries_by_season[1][0].season_entry_id,
                      entries_by_season[1][1].season_entry_id,
                  ),
              ),
          ):
              connection.execute(f"DELETE FROM {table} WHERE fixture_draw_id=? AND {key}", (draws[1].fixture_draw_id,))
              try:
                  connection.execute(
                      f"UPDATE {table} SET fixture_draw_id=?, season_id=?, {participant_update} WHERE fixture_draw_id=? AND {key}",
                      (draws[1].fixture_draw_id, draws[1].season_id, *participants, draws[0].fixture_draw_id),
                  )
                  raise SystemExit(f"{table} moved a child out of a frozen draw")
              except DBAPIError as error:
                  assert "frozen fixture draw is immutable" in str(error)
                  rejected_tables.append(table)
              # DatabaseConnection.execute uses a fresh pooled connection for
              # each call. The failed implicit transaction above is rolled
              # back when that short-lived connection closes, so this query
              # proves the next child-table attempt can actually run.
              assert connection.execute("SELECT 1 AS usable").fetchone()["usable"] == 1
          assert rejected_tables == ["season_fixture_number", "season_fixture_matchup"]
          connection.close()
          PY
