[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
# 120 rather than Ruff's 88-column default: chosen to match this codebase's
# existing wrapping style and keep the one-time formatting adoption diff
# mechanical (whitespace/line-break only), not a rewrite. See
# docs/ci-quality-gates.md.
line-length = 120

[tool.ruff.lint]
# Deliberately narrow: pyflakes correctness checks (F), the handful of
# pycodestyle rules Ruff itself defaults to (E4/E7/E9 -- import position,
# statement-level issues, syntax errors), and isort-style import ordering
# (I). No stylistic/refactor rule families (B, SIM, UP, RUF, ...) are
# enabled yet -- those flag real code patterns, not just formatting, and
# adopting them requires reviewing each hit rather than an automatic fix.
# Expanding this selection is a deliberate follow-up, not a side effect of
# this gate. See docs/ci-quality-gates.md.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.mypy]
python_version = "3.11"
# Incremental type-check scope (issue #39 / roadmap package 07). These are
# the season-domain/service modules described in ../docs/architecture.md --
# the persistence-backed boundary the 2027 season model is built on, not
# yet the routed HTTP surface. Expanding this list is how the gate grows;
# see docs/ci-quality-gates.md for the scope rationale and expansion policy.
files = [
    "app/audit.py",
    "app/season.py",
    "app/identity.py",
    "app/round_mapping.py",
    "app/fixtures.py",
]
# Local imports (e.g. app/db.py's connection boundary) are type-checked
# using their existing signatures but not required to satisfy this file's
# stricter flags themselves -- otherwise every module transitively imported
# by an in-scope file would silently join the gate. Expanding the gate to
# one of those modules means adding it to `files` explicitly.
follow_imports = "silent"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
# SQLAlchemy Core rows/engines and the repository layer's dynamic query
# results are not fully stubbed; this keeps the gate from failing on
# third-party type gaps outside BBBFFL's own control.
ignore_missing_imports = true
