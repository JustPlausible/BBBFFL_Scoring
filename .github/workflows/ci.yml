name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bbbffl_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            bbbffl_app/requirements.txt
            bbbffl_app/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build BBBFFL image
        run: docker build -t bbbffl-prototype ./bbbffl_app

  postgres-migrations:
    name: PostgreSQL migrations and repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bbbffl
          POSTGRES_PASSWORD: bbbffl
          POSTGRES_DB: bbbffl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bbbffl -d bbbffl_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: bbbffl_app
    env:
      BBBFFL_DATABASE_URL: postgresql+psycopg://bbbffl:bbbffl@localhost:5432/bbbffl_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bbbffl_app/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade twice and exercise scorer persistence and audit boundary
        run: |
          python -m app.migrations upgrade
          python -m app.migrations upgrade
          python - <<'PY'
          import os
          from app.db import DecisionsRepository, connect
          from app.audit import ActorContext, AuditEventRepository
          from sqlalchemy.exc import IntegrityError

          connection = connect(os.environ["BBBFFL_DATABASE_URL"])
          repository = DecisionsRepository(connection)
          repository.set_dnp("ci-team", "Forward1", True, actor=ActorContext.anonymous_operator(role="scorer"))
          assert repository.get_dnp_map() == {("ci-team", "Forward1"): True}

          events = AuditEventRepository(connection).list_events(entity_type="scoring.slot")
          assert len(events) == 1 and events[0].after_state == {"dnp": True}

          try:
              connection.execute(
                  "UPDATE audit_event SET reason = 'tampered' WHERE event_id = ?", (events[0].event_id,)
              )
              raise SystemExit("audit_event accepted an UPDATE on PostgreSQL -- append-only trigger regressed")
          except IntegrityError:
              pass
          connection.close()
          PY
